<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cadastro</title>
    <style>
      body {
          font-family: Arial, sans-serif;
          background-image: url('https://th.bing.com/th/id/OIP.HEVH-g6T7mfTw-1c_N9cowHaEJ?w=626&h=351&rs=1&pid=ImgDetMain');
          background-size: cover;
          background-position: center;
          text-align: center;
          color: white;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          margin: 0;
      }
      .container {
          width: 50%;
          background: rgba(255, 255, 255, 0.95);
          padding: 40px;
          border-radius: 10px;
          box-shadow: 0px 0px 10px gray;
          color: black;
      }
      input, select, button {
          margin: 10px;
          padding: 10px;
          width: 50%;
          border: none;
          border-radius: 5px;
      }
      input, select {
          background: #ffffff;
      }
      button {
          background: #007BFF;
          color: white;
          cursor: pointer;
          font-weight: bold;
      }
      button:hover {
          background: #0056b3;
      }
      h2 {
          font-size: 24px;
          color: #007BFF;
      }
      a {
          display: block;
          margin-top: 20px;
          color: #007BFF;
          font-weight: bold;
          text-decoration: none;
      }
      a:hover {
          text-decoration: underline;
      }
  </style>
</head>
<body>
  <div class="container">
    <h2> Novo Morador </h2>
    <p>Cadastre um novo integrante na sua grande familia</p>
    <form id="loginForm" action ="/registroMorador" method="post">
        <input type="text" id="nome" name="nome" placeholder="Coloque seu nome" required>
        <input type="date" id="data" name="data" placeholder="Data da viagem" required>
        <input type="text" id="preco" name="preco" placeholder="Preço da viagem" required>
        <input type="number" id="vagas" name="vagas" placeholder="numero de pessoas que irao vir" required>

        <button type="submit">Adicionar Viagem</button>
        <p id="error-message" style="color:red; display:none;">Preencha todos os campos!</p>
    </form>
</div>
</body>
</html>
