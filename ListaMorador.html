<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesquisar Morador</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f2ed;
      display: flex;
      justify-content: center;
      padding: 40px;
    }
    .container {
      background-color: #fffaf4;
      padding: 20px 30px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      width: 600px;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    label {
      font-weight: bold;
    }
    input[type="text"] {
      width: 60%;
      padding: 5px;
      margin-right: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      background-color: #ddd;
      cursor: pointer;
    }
    button:hover {
      background-color: #ccc;
    }
    .button-group {
      margin: 10px 0;
      display: flex;
      justify-content: space-between;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #999;
      padding: 8px;
      text-align: center;
    }
    th {
      background-color: #ccc;
    }
    .acoes a {
      margin: 0 5px;
      text-decoration: none;
      color: #007BFF;
    }
    .acoes a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Condomínio</h1>
    <h3>Pesquisar Morador</h3>
    <div>
      <label for="pesquisa">Pesquisa:</label>
      <input type="text" id="pesquisa" name="pesquisa" placeholder="Nome ou CPF...">
      <button onclick="window.location.href='/registroMorador'">Novo Morador</button>
    </div>
    <div class="button-group">
      <div></div>
      <button onclick="window.location.href='/menu'">Voltar</button>
    </div>

    <table id="tabelaMoradores">
      <thead>
        <tr>
          <th>Nome</th>
          <th>CPF</th>
          <th>Telefone</th>
          <th>Apartamento</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <!-- Dados serão inseridos dinamicamente -->
      </tbody>
    </table>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      fetch('/api/moradores')
        .then(res => res.json())
        .then(data => {
          const tbody = document.querySelector('#tabelaMoradores tbody');
          tbody.innerHTML = '';
          data.forEach(morador => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${morador.nome}</td>
              <td>${morador.cpf}</td>
              <td>${morador.telefone}</td>
              <td>${morador.apartamento}</td>
              <td class="acoes">
                <a href="#" onclick="alterarMorador(${morador.id})">Alterar</a>
                <a href="#" onclick="excluirMorador(${morador.id})">Excluir</a>
              </td>
            `;
            tbody.appendChild(tr);
          });
        })
        .catch(err => console.error('Erro ao buscar moradores:', err));
    });

    function alterarMorador(id) {
      alert('Alterar morador com ID: ' + id);
      // Redirecionar para página de edição se desejar
    }

    function excluirMorador(id) {
      if (confirm('Deseja realmente excluir o morador com ID: ' + id + '?')) {
        fetch(`/api/moradores/${id}`, { method: 'DELETE' })
          .then(res => {
            if (res.ok) {
              location.reload();
            } else {
              alert('Erro ao excluir morador.');
            }
          });
      }
    }
  </script>
</body>
</html
